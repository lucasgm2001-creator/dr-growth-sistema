<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarefas — DR Growth</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div><img src="imgs/logo.png" alt="Logo da empresa"></div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">
      <div class="nav-section-label">Principal</div>
      <a href="dashboard.html" class="nav-item" data-page="dashboard.html"><span class="nav-icon">⬛</span> Dashboard</a>
      <a href="funil.html" class="nav-item" data-page="funil.html"><span class="nav-icon">◈</span> Funil de Vendas</a>
      <a href="leads.html" class="nav-item" data-page="leads.html"><span class="nav-icon">◉</span> Gestão de Leads</a>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">Operações</div>
      <a href="tarefas.html" class="nav-item" data-page="tarefas.html"><span class="nav-icon">✓</span> Tarefas</a>
      <a href="clientes.html" class="nav-item" data-page="clientes.html"><span class="nav-icon">★</span> Clientes</a>
      <a href="financeiro.html" class="nav-item" data-page="financeiro.html"><span class="nav-icon">$</span> Financeiro</a>
    </div>
  </nav>
  <div class="sidebar-footer"><div class="user-profile" id="user-profile"></div></div>
</aside>

<div class="main-content">
  <header class="topbar">
    <button class="menu-toggle" id="menu-toggle">☰</button>
    <div class="topbar-title">
      <h1>Tarefas</h1>
      <p id="tasks-subtitle">Carregando…</p>
    </div>
    <div class="topbar-actions">
      <div class="clock-row">
        <div class="clock-item"><span class="clock-tz">🇧🇷 Brasil</span><span class="clock-time" id="clock-br">--:--:--</span></div>
        <div class="clock-divider"></div>
        <div class="clock-item"><span class="clock-tz">🇺🇸 EUA</span><span class="clock-time" id="clock-us">--:--:--</span></div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openModal()">+ Nova Tarefa</button>
    </div>
  </header>

  <main class="page-content">

    <!-- Filtros -->
    <div class="filter-bar animate-in">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search" placeholder="Buscar tarefas…" oninput="filterTasks()">
      </div>
      <select class="filter-select" id="filter-resp" onchange="filterTasks()">
        <option value="">Todos os responsáveis</option>
        <option>Daniel</option><option>Lucas</option><option>Gabriel</option><option>Thamyris</option>
      </select>
      <select class="filter-select" id="filter-priority" onchange="filterTasks()">
        <option value="">Todas as prioridades</option>
        <option value="high">Alta</option>
        <option value="medium">Média</option>
        <option value="low">Baixa</option>
      </select>
      <select class="filter-select" id="filter-status" onchange="filterTasks()">
        <option value="">Todos os status</option>
        <option value="pending">Pendente</option>
        <option value="in_progress">Em andamento</option>
        <option value="done">Concluído</option>
      </select>
      <select class="filter-select" id="filter-due" onchange="filterTasks()">
        <option value="">Qualquer prazo</option>
        <option value="today">Hoje</option>
        <option value="week">Esta semana</option>
        <option value="overdue">Atrasadas</option>
      </select>
    </div>

    <!-- KPIs rápidos -->
    <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap" class="animate-in" style="animation-delay:0.1s">
      <div class="fin-card" style="flex:1;min-width:130px;padding:14px 18px">
        <div class="fin-card-label">Pendentes</div>
        <div class="fin-card-value" id="count-pending" style="font-size:22px">—</div>
      </div>
      <div class="fin-card" style="flex:1;min-width:130px;padding:14px 18px;border-color:rgba(99,102,241,0.3)">
        <div class="fin-card-label">Em Andamento</div>
        <div class="fin-card-value" id="count-progress" style="font-size:22px;color:var(--accent)">—</div>
      </div>
      <div class="fin-card" style="flex:1;min-width:130px;padding:14px 18px;border-color:rgba(34,197,94,0.3)">
        <div class="fin-card-label">Concluídas</div>
        <div class="fin-card-value" id="count-done" style="font-size:22px;color:var(--green)">—</div>
      </div>
      <div class="fin-card" style="flex:1;min-width:130px;padding:14px 18px;border-color:rgba(239,68,68,0.3)">
        <div class="fin-card-label">Atrasadas</div>
        <div class="fin-card-value" id="count-overdue" style="font-size:22px;color:var(--red)">—</div>
      </div>
    </div>

    <!-- Lista de tarefas -->
    <div class="card animate-in" style="animation-delay:0.15s">
      <div class="card-header">
        <span class="card-title">Lista de Tarefas</span>
        <span id="tasks-count" class="text-muted"></span>
      </div>
      <div id="tasks-list">
        <div class="empty-state"><div class="empty-icon">✓</div><p>Carregando…</p></div>
      </div>
    </div>

  </main>
</div>

<!-- MODAL Tarefa -->
<div class="modal-overlay" id="task-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Nova Tarefa</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="task-id">
      <div class="form-group">
        <label>Título *</label>
        <input type="text" class="form-control" id="task-title" placeholder="Descreva a tarefa…">
      </div>
      <div class="form-group">
        <label>Descrição</label>
        <textarea class="form-control" id="task-desc" rows="2" placeholder="Detalhes opcionais…" style="resize:vertical"></textarea>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Responsável</label>
          <select class="form-control" id="task-responsible">
            <option>Daniel</option><option>Lucas</option><option>Gabriel</option><option>Thamyris</option>
          </select>
        </div>
        <div class="form-group">
          <label>Prazo</label>
          <input type="date" class="form-control" id="task-due">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Prioridade</label>
          <select class="form-control" id="task-priority">
            <option value="high">Alta</option>
            <option value="medium" selected>Média</option>
            <option value="low">Baixa</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select class="form-control" id="task-status">
            <option value="pending">Pendente</option>
            <option value="in_progress">Em andamento</option>
            <option value="done">Concluído</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger btn-sm" id="delete-btn" onclick="deleteTask()" style="display:none;margin-right:auto">Excluir</button>
      <button class="btn btn-primary" onclick="saveTask()">Salvar</button>
    </div>
  </div>
</div>

<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
const session = initPage();
if (!session) throw new Error('Not authenticated');

let allTasks = [];

const DEMO_TASKS = [
  { id:1, title:'Enviar proposta para MedTech Brasil', description:'Incluir pacote social + tráfego', responsible:'Lucas', due_date:'2026-05-18', priority:'high', status:'pending', created_at:'2026-05-10' },
  { id:2, title:'Configurar campanhas de Google Ads', description:'Conta US Digital LLC', responsible:'Gabriel', due_date:'2026-05-15', priority:'high', status:'in_progress', created_at:'2026-05-12' },
  { id:3, title:'Reunião de onboarding — GrowthX', description:'', responsible:'Daniel', due_date:'2026-05-16', priority:'medium', status:'pending', created_at:'2026-05-10' },
  { id:4, title:'Emitir NFs de maio', description:'Todos os clientes ativos', responsible:'Thamyris', due_date:'2026-05-20', priority:'medium', status:'pending', created_at:'2026-05-13' },
  { id:5, title:'Revisar relatório mensal de clientes', description:'', responsible:'Daniel', due_date:'2026-05-22', priority:'low', status:'pending', created_at:'2026-05-11' },
  { id:6, title:'Ajustar landing page US Digital', description:'Correções solicitadas pelo cliente', responsible:'Gabriel', due_date:'2026-05-17', priority:'high', status:'in_progress', created_at:'2026-05-13' },
  { id:7, title:'Follow-up Sarah Johnson', description:'Confirmar reunião de 20/05', responsible:'Lucas', due_date:'2026-05-14', priority:'high', status:'done', created_at:'2026-05-10' },
  { id:8, title:'Cobrar pagamento US Digital', description:'Boleto em atraso desde 12/05', responsible:'Thamyris', due_date:'2026-05-10', priority:'high', status:'pending', created_at:'2026-05-12' },
];

const PRIORITY = { high:{ label:'Alta', cls:'priority-high' }, medium:{ label:'Média', cls:'priority-medium' }, low:{ label:'Baixa', cls:'priority-low' } };
const STATUS   = { pending:{ label:'Pendente', cls:'badge-yellow' }, in_progress:{ label:'Em andamento', cls:'badge-accent' }, done:{ label:'Concluído', cls:'badge-green' } };

function saveTasksLocal() { try { localStorage.setItem('drg_tasks', JSON.stringify(allTasks)); } catch {} }
function loadTasksLocal() { try { return JSON.parse(localStorage.getItem('drg_tasks') || '[]'); } catch { return []; } }

async function loadTasks() {
  let loadedFromRemote = false;
  if (window.drSupabase) {
    try {
      const { data, error } = await window.drSupabase.from('tasks').select('*').order('due_date');
      if (!error && data?.length) { allTasks = data; loadedFromRemote = true; saveTasksLocal(); }
    } catch {}
  }
  if (!loadedFromRemote) {
    const local = loadTasksLocal();
    allTasks = local.length ? local : DEMO_TASKS;
  }
  updateKPIs();
  renderTasks(allTasks);
}

function isOverdue(t) {
  if (t.status === 'done') return false;
  if (!t.due_date) return false;
  return new Date(t.due_date + 'T23:59:59') < new Date();
}

function updateKPIs() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('count-pending').textContent  = allTasks.filter(t => t.status === 'pending').length;
  document.getElementById('count-progress').textContent = allTasks.filter(t => t.status === 'in_progress').length;
  document.getElementById('count-done').textContent     = allTasks.filter(t => t.status === 'done').length;
  document.getElementById('count-overdue').textContent  = allTasks.filter(isOverdue).length;
  document.getElementById('tasks-subtitle').textContent = `${allTasks.filter(t => t.status !== 'done').length} pendentes · ${allTasks.filter(isOverdue).length} atrasadas`;
}

function filterTasks() {
  const q    = document.getElementById('search').value.toLowerCase();
  const resp = document.getElementById('filter-resp').value;
  const pri  = document.getElementById('filter-priority').value;
  const sta  = document.getElementById('filter-status').value;
  const due  = document.getElementById('filter-due').value;
  const today = new Date().toISOString().split('T')[0];
  const weekEnd = new Date(Date.now() + 7*86400000).toISOString().split('T')[0];

  const filtered = allTasks.filter(t => {
    if (q && !t.title.toLowerCase().includes(q)) return false;
    if (resp && t.responsible !== resp) return false;
    if (pri && t.priority !== pri) return false;
    if (sta && t.status !== sta) return false;
    if (due === 'today' && t.due_date !== today) return false;
    if (due === 'week' && (t.due_date < today || t.due_date > weekEnd)) return false;
    if (due === 'overdue' && !isOverdue(t)) return false;
    return true;
  });

  renderTasks(filtered);
}

function renderTasks(tasks) {
  document.getElementById('tasks-count').textContent = `${tasks.length} tarefas`;

  if (!tasks.length) {
    document.getElementById('tasks-list').innerHTML = `<div class="empty-state"><div class="empty-icon">✓</div><h3>Nenhuma tarefa</h3><p>Tente outros filtros ou crie uma nova tarefa.</p></div>`;
    return;
  }

  // Agrupa por status
  const groups = { in_progress: [], pending: [], done: [] };
  tasks.forEach(t => { if (groups[t.status]) groups[t.status].push(t); else groups.pending.push(t); });

  const groupOrder = [
    { key:'in_progress', label:'Em Andamento' },
    { key:'pending',     label:'Pendentes' },
    { key:'done',        label:'Concluídas' },
  ];

  let html = '';
  groupOrder.forEach(g => {
    const list = groups[g.key];
    if (!list.length) return;

    const sorted = [...list].sort((a,b) => {
      const po = { high:0, medium:1, low:2 };
      const diff = (po[a.priority]||1) - (po[b.priority]||1);
      if (diff !== 0) return diff;
      return (a.due_date||'').localeCompare(b.due_date||'');
    });

    html += `<div style="padding:10px 16px 4px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;border-bottom:1px solid var(--border)">${g.label} (${list.length})</div>`;
    html += sorted.map(t => renderTaskItem(t)).join('');
  });

  document.getElementById('tasks-list').innerHTML = html;
}

function renderTaskItem(t) {
  const pri   = PRIORITY[t.priority] || { label: t.priority, cls: 'badge-muted' };
  const sta   = STATUS[t.status]     || { label: t.status, cls: 'badge-muted' };
  const over  = isOverdue(t);
  const dueLabel = t.due_date ? `${fmt.relative(t.due_date)} (${fmt.date(t.due_date)})` : '';

  return `
    <div class="task-item">
      <div class="task-check ${t.status==='done'?'done':''}" onclick="toggleStatus(${t.id},event)">${t.status==='done'?'✓':''}</div>
      <div class="task-content">
        <div class="task-title ${t.status==='done'?'done':''}">${t.title}</div>
        ${t.description ? `<div class="text-muted mt-1" style="font-size:12px">${t.description}</div>` : ''}
        <div class="task-meta mt-1">
          <span>
            <div class="avatar avatar-sm avatar-${fmt.avatarClass(t.responsible)}" style="display:inline-flex">${fmt.initials(t.responsible)}</div>
            ${t.responsible}
          </span>
          ${dueLabel ? `<span style="color:${over?'var(--red)':'var(--text-muted)'}">📅 ${dueLabel}${over?' ⚠️':''}</span>` : ''}
          <span class="badge ${pri.cls}">${pri.label}</span>
          <span class="badge ${sta.cls}">${sta.label}</span>
        </div>
      </div>
      <div class="task-actions">
        <button class="btn btn-ghost btn-sm" onclick="openEditModal(${t.id})">✏️</button>
      </div>
    </div>`;
}

async function toggleStatus(id, event) {
  event.stopPropagation();
  const task = allTasks.find(t => t.id === id);
  if (!task) return;

  const next = task.status === 'done' ? 'pending' : 'done';
  task.status = next;

  if (window.drSupabase) {
    await window.drSupabase.from('tasks').update({ status: next }).eq('id', id);
  }
  saveTasksLocal();

  updateKPIs();
  filterTasks();
  showToast(next === 'done' ? 'Tarefa concluída! ✓' : 'Tarefa reaberta.', 'success');
}

// ---- Modal ----
function openModal() {
  document.getElementById('modal-title').textContent = 'Nova Tarefa';
  document.getElementById('task-id').value = '';
  document.getElementById('task-title').value = '';
  document.getElementById('task-desc').value = '';
  document.getElementById('task-responsible').value = session.name.split(' ')[0];
  document.getElementById('task-due').value = '';
  document.getElementById('task-priority').value = 'medium';
  document.getElementById('task-status').value = 'pending';
  document.getElementById('delete-btn').style.display = 'none';
  document.getElementById('task-modal').classList.add('show');
}

function openEditModal(id) {
  const t = allTasks.find(x => x.id === id);
  if (!t) return;
  document.getElementById('modal-title').textContent = 'Editar Tarefa';
  document.getElementById('task-id').value = t.id;
  document.getElementById('task-title').value = t.title || '';
  document.getElementById('task-desc').value = t.description || '';
  document.getElementById('task-responsible').value = t.responsible || 'Daniel';
  document.getElementById('task-due').value = t.due_date || '';
  document.getElementById('task-priority').value = t.priority || 'medium';
  document.getElementById('task-status').value = t.status || 'pending';
  document.getElementById('delete-btn').style.display = 'inline-flex';
  document.getElementById('task-modal').classList.add('show');
}

function closeModal() { document.getElementById('task-modal').classList.remove('show'); }

async function saveTask() {
  const id    = document.getElementById('task-id').value;
  const title = document.getElementById('task-title').value.trim();
  if (!title) { showToast('Título é obrigatório.', 'error'); return; }

  const data = {
    title,
    description:  document.getElementById('task-desc').value.trim(),
    responsible:  document.getElementById('task-responsible').value,
    due_date:     document.getElementById('task-due').value || null,
    priority:     document.getElementById('task-priority').value,
    status:       document.getElementById('task-status').value,
  };

  if (id) {
    if (window.drSupabase) await window.drSupabase.from('tasks').update(data).eq('id', id);
    const idx = allTasks.findIndex(t => t.id == id);
    if (idx >= 0) allTasks[idx] = { ...allTasks[idx], ...data };
    showToast('Tarefa atualizada!', 'success');
    logActivity({ icon:'✏️', color:'#6366f1', msg:`Tarefa "${title}" atualizada`, sector:'tarefas' });
  } else {
    data.created_at = new Date().toISOString();
    const newId = Date.now();
    if (window.drSupabase) {
      const { data: ins } = await window.drSupabase.from('tasks').insert(data).select().single();
      if (ins) allTasks.unshift(ins);
    } else { allTasks.unshift({ ...data, id: newId }); }
    showToast('Tarefa criada!', 'success');
    logActivity({ icon:'📋', color:'#6366f1', msg:`Nova tarefa criada — "${title}" (resp: ${data.responsible})`, sector:'tarefas' });
  }

  closeModal();
  updateKPIs();
  filterTasks();
}

async function deleteTask() {
  const id = document.getElementById('task-id').value;
  if (!id || !confirm('Excluir esta tarefa?')) return;
  const task = allTasks.find(t => t.id == id);
  if (window.drSupabase) await window.drSupabase.from('tasks').delete().eq('id', id);
  allTasks = allTasks.filter(t => t.id != id);
  closeModal();
  updateKPIs();
  filterTasks();
  showToast('Tarefa excluída.', 'info');
  if (task) logActivity({ icon:'🗑️', color:'#ef4444', msg:`Tarefa "${task.title}" excluída`, sector:'tarefas' });
}

document.getElementById('task-modal').addEventListener('click', e => { if (e.target === document.getElementById('task-modal')) closeModal(); });
loadTasks();
</script>
</body>
</html>

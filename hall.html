<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hall — DR Growth</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .hall-section { border-radius: 12px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 16px; overflow: hidden; }
    .hall-section-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; cursor: pointer; user-select: none; transition: background 0.15s; }
    .hall-section-header:hover { background: var(--surface-hover, rgba(255,255,255,0.04)); }
    .hall-section-toggle { margin-left: auto; font-size: 12px; color: var(--text-muted); transition: transform 0.2s; }
    .hall-section-toggle.open { transform: rotate(180deg); }
    .hall-section-body { display: none; border-top: 1px solid var(--border); }
    .hall-section-body.open { display: block; }
    .post-form { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); align-items: flex-start; }
    .post-form textarea { flex: 1; min-height: 36px; max-height: 100px; resize: none; font-size: 13px; }
    .feed-item-actions { display: flex; gap: 4px; margin-left: auto; opacity: 0; transition: opacity 0.15s; }
    .feed-item:hover .feed-item-actions { opacity: 1; }
    .edited-tag { font-size: 10px; color: var(--text-muted); font-style: italic; margin-top: 2px; }
    .aviso-item:hover .feed-item-actions { opacity: 1; }
    .aviso-item { position: relative; }
    .inline-edit { display: flex; gap: 8px; margin-top: 8px; }
    .inline-edit textarea { flex: 1; font-size: 13px; min-height: 48px; resize: none; }
  </style>
</head>
<body class="hall-page">
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">DR</div>
    <div class="sidebar-brand"><h2>DR Growth</h2><span>Sistema de Gestão</span></div>
  </div>
  <div class="elevator-label">Elevador</div>
  <nav class="elevator-nav" id="elevator-nav"></nav>
  <div class="sidebar-footer"><div class="user-profile" id="user-profile"></div></div>
</aside>

<div class="main-content">
  <header class="topbar">
    <button class="menu-toggle" id="menu-toggle">☰</button>
    <div class="topbar-title">
      <h1>Hall</h1>
      <p>Recepção · DR Growth</p>
    </div>
    <div class="topbar-actions">
      <div class="clock-row">
        <div class="clock-item"><span class="clock-tz">🇧🇷 São Paulo</span><span class="clock-time" id="clock-br">--:--:--</span></div>
        <div class="clock-divider"></div>
        <div class="clock-item"><span class="clock-tz">🇺🇸 New York</span><span class="clock-time" id="clock-us">--:--:--</span></div>
      </div>
    </div>
  </header>

  <main class="page-content">

    <!-- Saudação -->
    <div class="hall-greeting animate-in">
      <div class="hall-greeting-inner">
        <div class="greeting-text">
          <h1 id="greeting-msg">Bom dia 👋</h1>
          <p id="greeting-sub">Aqui estão as novidades de hoje na DR Growth.</p>
        </div>
        <div class="greeting-date">
          <div class="date-main" id="greeting-date">—</div>
          <div class="date-sub" id="greeting-weekday">—</div>
        </div>
      </div>
    </div>

    <!-- Grid principal -->
    <div class="hall-grid">

      <!-- Coluna esquerda: Feed -->
      <div>
        <div class="hall-section animate-in" style="animation-delay:0.1s">
          <div class="hall-section-header" onclick="toggleSection('feed')">
            <div class="feed-live-dot" style="width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0"></div>
            <h3 style="margin:0;font-size:14px;font-weight:700">O que aconteceu</h3>
            <span class="text-muted text-sm" id="feed-time-range" style="margin-left:4px">Últimas 24h</span>
            <span class="hall-section-toggle" id="feed-toggle">▼</span>
          </div>
          <div class="hall-section-body" id="feed-body">
            <div class="post-form">
              <div class="avatar avatar-sm avatar-${''}" id="feed-post-avatar" style="flex-shrink:0;margin-top:2px"></div>
              <textarea class="form-control" id="feed-input" placeholder="Registrar uma atualização para o time…" rows="1"></textarea>
              <button class="btn btn-primary btn-sm" onclick="postFeedItem()" style="align-self:flex-end">Postar</button>
            </div>
            <div id="feed-list">
              <div class="empty-state" style="padding:32px"><div class="empty-icon">📡</div><p>Carregando…</p></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Coluna direita: Mural + Time -->
      <div>

        <!-- Mural de Avisos -->
        <div class="hall-section animate-in" style="animation-delay:0.15s">
          <div class="hall-section-header" onclick="toggleSection('mural')">
            <span style="font-size:16px">📌</span>
            <h3 style="margin:0;font-size:14px;font-weight:700">Mural de Avisos</h3>
            <span class="hall-section-toggle" id="mural-toggle">▼</span>
          </div>
          <div class="hall-section-body" id="mural-body">
            <div class="post-form">
              <div class="avatar avatar-sm" id="mural-post-avatar" style="flex-shrink:0;margin-top:2px"></div>
              <textarea class="form-control" id="aviso-input" placeholder="Escreva um aviso para o time…" rows="1" maxlength="400"></textarea>
              <button class="btn btn-primary btn-sm" onclick="postAviso()" style="align-self:flex-end">Postar</button>
            </div>
            <div id="mural-list">
              <div class="empty-state" style="padding:20px"><div class="empty-icon">📌</div><p>Sem avisos.</p></div>
            </div>
          </div>
        </div>

        <!-- Time hoje -->
        <div class="hall-section animate-in" style="animation-delay:0.2s">
          <div class="hall-section-header" onclick="toggleSection('team')">
            <span style="font-size:16px">👥</span>
            <h3 style="margin:0;font-size:14px;font-weight:700">Time hoje</h3>
            <span class="hall-section-toggle" id="team-toggle">▼</span>
          </div>
          <div class="hall-section-body" id="team-body">
            <div id="team-list"></div>
          </div>
        </div>

      </div>
    </div>

  </main>
</div>

<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
const session = initPage('hall.html');
if (!session) throw new Error('Not authenticated');

// ---- Saudação ----
function setGreeting() {
  const h = new Date().getHours();
  const period = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  const emoji  = h < 12 ? '☀️' : h < 18 ? '🌤️' : '🌙';
  document.getElementById('greeting-msg').innerHTML = `${period}, <span>${session.name.split(' ')[0]}</span> ${emoji}`;
  const subs = {
    admin:     'Você tem acesso total ao sistema.',
    comercial: 'Confira os leads e oportunidades no Comercial.',
    trafego:   'Suas campanhas estão no Tráfego.',
    financeiro:'O financeiro e os contratos estão te esperando.',
  };
  document.getElementById('greeting-sub').textContent = subs[session.role] || 'Aqui estão as novidades de hoje.';
}

function updateDates() {
  const now = new Date();
  const dayNames = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const monthNames = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  document.getElementById('greeting-date').textContent = `${now.getDate()} de ${monthNames[now.getMonth()]} de ${now.getFullYear()}`;
  document.getElementById('greeting-weekday').textContent = dayNames[now.getDay()];
}

setGreeting();
updateDates();
setInterval(updateDates, 60000);

// ---- Avatar dos campos de post ----
function initPostAvatars() {
  const avatarCls = fmt.avatarClass(session.name);
  ['feed-post-avatar','mural-post-avatar'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.className = `avatar avatar-sm avatar-${avatarCls}`;
      el.textContent = fmt.initials(session.name);
    }
  });
}

// ---- Toggle sections ----
function toggleSection(name) {
  const body   = document.getElementById(name + '-body');
  const toggle = document.getElementById(name + '-toggle');
  const isOpen = body.classList.toggle('open');
  toggle.classList.toggle('open', isOpen);
}

// ---- FEED ----
const FEED_DEFAULT = [
  { id:1, icon:'📥', color:'#3b82f6', msg:'Novo lead <strong>Marcos Souza</strong> adicionado ao funil', who:'Lucas Moraes', time: new Date(Date.now() - 15*60000).toISOString(), system:true },
  { id:2, icon:'💰', color:'#22c55e', msg:'Pagamento de <strong>GrowthX Agency — R$12.000</strong> confirmado', who:'Thamyris Lages', time: new Date(Date.now() - 45*60000).toISOString(), system:true },
  { id:3, icon:'✅', color:'#22c55e', msg:'Tarefa <strong>Follow-up Sarah Johnson</strong> concluída', who:'Lucas Moraes', time: new Date(Date.now() - 90*60000).toISOString(), system:true },
  { id:4, icon:'📊', color:'#a855f7', msg:'Campanha <strong>Google Ads — MedTech</strong> otimizada', who:'Gabriel Ramos', time: new Date(Date.now() - 2*3600000).toISOString(), system:true },
  { id:5, icon:'📈', color:'#3b82f6', msg:'Lead <strong>Sarah Johnson</strong> movido para Reunião Agendada', who:'Lucas Moraes', time: new Date(Date.now() - 3*3600000).toISOString(), system:true },
];

function getFeedItems() {
  try { return JSON.parse(localStorage.getItem('drg_feed') || 'null') || FEED_DEFAULT; } catch { return FEED_DEFAULT; }
}
function saveFeedItems(items) { localStorage.setItem('drg_feed', JSON.stringify(items)); }

function renderFeed() {
  const items = getFeedItems();
  if (!items.length) {
    document.getElementById('feed-list').innerHTML = `<div class="empty-state" style="padding:24px"><div class="empty-icon">📡</div><h3>Tudo quieto</h3></div>`;
    return;
  }
  document.getElementById('feed-list').innerHTML = items.map((item, i) => {
    const isOwner = item.who === session.name && !item.system;
    return `
    <div class="feed-item animate-in" style="animation-delay:${i*0.03}s;position:relative" id="feed-item-${item.id}">
      <div class="feed-icon" style="background:${item.color||'#6366f1'}18;font-size:18px">${item.icon||'💬'}</div>
      <div class="feed-content" style="flex:1">
        <div class="feed-msg">${item.msg}</div>
        ${item.edited ? `<div class="edited-tag">editado</div>` : ''}
        <div class="feed-meta">
          <div class="avatar avatar-sm avatar-${fmt.avatarClass(item.who.split(' ')[0])}">${fmt.initials(item.who)}</div>
          ${item.who}
          <span style="margin-left:4px;color:var(--text-muted)">· ${fmt.timeAgo(item.time)}</span>
        </div>
        <div id="feed-edit-${item.id}" style="display:none" class="inline-edit">
          <textarea class="form-control" id="feed-edit-text-${item.id}" rows="2">${item.msg.replace(/<[^>]*>/g,'')}</textarea>
          <div style="display:flex;flex-direction:column;gap:4px">
            <button class="btn btn-primary btn-sm" onclick="saveFeedEdit(${item.id})">Salvar</button>
            <button class="btn btn-ghost btn-sm" onclick="cancelFeedEdit(${item.id})">✕</button>
          </div>
        </div>
      </div>
      ${isOwner ? `
      <div class="feed-item-actions" style="display:flex;gap:4px">
        <button class="btn btn-ghost btn-sm" style="padding:2px 6px;font-size:11px" onclick="startFeedEdit(${item.id})">✏️</button>
        <button class="btn btn-ghost btn-sm" style="padding:2px 6px;font-size:11px;color:var(--red)" onclick="deleteFeedItem(${item.id})">✕</button>
      </div>` : ''}
    </div>`;
  }).join('');
}

function postFeedItem() {
  const input = document.getElementById('feed-input');
  const text = input.value.trim();
  if (!text) return;
  const items = getFeedItems();
  items.unshift({ id: Date.now(), icon:'💬', color:'#6366f1', msg: escapeHtml(text), who: session.name, time: new Date().toISOString(), system: false });
  saveFeedItems(items);
  input.value = '';
  renderFeed();
  showToast('Atualização postada!', 'success');
}

function startFeedEdit(id) {
  document.getElementById('feed-edit-' + id).style.display = 'flex';
}
function cancelFeedEdit(id) {
  document.getElementById('feed-edit-' + id).style.display = 'none';
}
function saveFeedEdit(id) {
  const text = document.getElementById('feed-edit-text-' + id).value.trim();
  if (!text) return;
  const items = getFeedItems();
  const idx = items.findIndex(x => x.id === id);
  if (idx >= 0 && items[idx].who === session.name) {
    items[idx].msg = escapeHtml(text);
    items[idx].edited = true;
    saveFeedItems(items);
    renderFeed();
    showToast('Atualização editada.', 'success');
  }
}
function deleteFeedItem(id) {
  const items = getFeedItems();
  const item = items.find(x => x.id === id);
  if (!item || item.who !== session.name) return;
  saveFeedItems(items.filter(x => x.id !== id));
  renderFeed();
}

document.getElementById('feed-input')?.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); postFeedItem(); } });

// ---- MURAL ----
const AVISOS_DEFAULT = [
  { id:1, text:'Reunião de alinhamento toda segunda às 9h (BR) / 8h (ET). Link no grupo do WhatsApp.', author:'Daniel Ramos', pinned:true,  time: new Date(Date.now() - 2*86400000).toISOString() },
  { id:2, text:'Prazo para envio de NFs: todo dia 20 do mês. Thamyris coordena.',                      author:'Daniel Ramos', pinned:false, time: new Date(Date.now() - 5*86400000).toISOString() },
];

function getAvisos() {
  try { return JSON.parse(localStorage.getItem('drg_avisos') || 'null') || AVISOS_DEFAULT; } catch { return AVISOS_DEFAULT; }
}
function saveAvisos(avisos) { localStorage.setItem('drg_avisos', JSON.stringify(avisos)); }

function renderMural() {
  const avisos = getAvisos();
  const isAdmin = session.role === 'admin';
  if (!avisos.length) {
    document.getElementById('mural-list').innerHTML = `<div class="empty-state" style="padding:20px"><div class="empty-icon">📌</div><p>Sem avisos.</p></div>`;
    return;
  }
  const sorted = [...avisos].sort((a,b) => (b.pinned?1:0)-(a.pinned?1:0));
  document.getElementById('mural-list').innerHTML = sorted.map(a => {
    const isOwner = a.author === session.name;
    return `
    <div class="aviso-item" id="aviso-item-${a.id}">
      ${a.pinned ? '<div class="aviso-pinned">📌 fixado</div>' : ''}
      <div class="aviso-text" id="aviso-text-${a.id}">${escapeHtml(a.text)}</div>
      ${a.edited ? `<div class="edited-tag">editado</div>` : ''}
      <div class="aviso-author">
        <div class="avatar avatar-sm avatar-${fmt.avatarClass(a.author.split(' ')[0])}">${fmt.initials(a.author)}</div>
        ${a.author} · ${fmt.timeAgo(a.time)}
        <div class="feed-item-actions" style="margin-left:auto">
          ${isOwner ? `<button class="btn btn-ghost btn-sm" style="padding:2px 6px;font-size:11px" onclick="startAvisoEdit(${a.id})">✏️</button>` : ''}
          ${(isOwner || isAdmin) ? `<button class="btn btn-ghost btn-sm" style="padding:2px 6px;font-size:11px;color:var(--red)" onclick="removeAviso(${a.id})">✕</button>` : ''}
        </div>
      </div>
      <div id="aviso-edit-${a.id}" style="display:none" class="inline-edit" style="padding:0 16px 12px">
        <textarea class="form-control" id="aviso-edit-text-${a.id}" rows="2">${a.text}</textarea>
        <div style="display:flex;flex-direction:column;gap:4px">
          <button class="btn btn-primary btn-sm" onclick="saveAvisoEdit(${a.id})">Salvar</button>
          <button class="btn btn-ghost btn-sm" onclick="cancelAvisoEdit(${a.id})">✕</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function postAviso() {
  const input = document.getElementById('aviso-input');
  const text = input.value.trim();
  if (!text) return;
  const avisos = getAvisos();
  avisos.unshift({ id: Date.now(), text, author: session.name, pinned: false, time: new Date().toISOString() });
  saveAvisos(avisos);
  input.value = '';
  renderMural();
  showToast('Aviso postado!', 'success');
}

function startAvisoEdit(id) { document.getElementById('aviso-edit-' + id).style.display = 'flex'; }
function cancelAvisoEdit(id) { document.getElementById('aviso-edit-' + id).style.display = 'none'; }

function saveAvisoEdit(id) {
  const text = document.getElementById('aviso-edit-text-' + id).value.trim();
  if (!text) return;
  const avisos = getAvisos();
  const idx = avisos.findIndex(a => a.id === id);
  if (idx >= 0 && avisos[idx].author === session.name) {
    avisos[idx].text = text;
    avisos[idx].edited = true;
    saveAvisos(avisos);
    renderMural();
    showToast('Aviso editado.', 'success');
  }
}

function removeAviso(id) {
  const avisos = getAvisos();
  const item = avisos.find(a => a.id === id);
  if (!item) return;
  if (item.author !== session.name && session.role !== 'admin') return;
  saveAvisos(avisos.filter(a => a.id !== id));
  renderMural();
}

document.getElementById('aviso-input')?.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); postAviso(); } });

// ---- TEAM ----
const TEAM = [
  { name:'Daniel Ramos',   role:'Gestor / Admin',             color:'#6366f1', status:'online', activity:'Revisando métricas' },
  { name:'Lucas Moraes',   role:'Comercial EUA',              color:'#3b82f6', status:'online', activity:'Follow-up de leads' },
  { name:'Gabriel Ramos',  role:'Tráfego & Administrativo',   color:'#a855f7', status:'online', activity:'Otimizando campanhas' },
  { name:'Thamyris Lages', role:'Administrativo & Financeiro',color:'#22c55e', status:'away',   activity:'Emitindo NFs' },
];

const statusLabels = { online:'● Online', away:'◌ Ocupado', offline:'○ Offline' };
const statusColors = { online:'var(--green)', away:'var(--yellow)', offline:'var(--text-muted)' };

function renderTeam() {
  document.getElementById('team-list').innerHTML = TEAM.map(m => `
    <div class="team-member">
      <div class="avatar" style="background:linear-gradient(135deg,${m.color},${m.color}88)">${fmt.initials(m.name)}</div>
      <div class="team-member-info">
        <div class="tm-name">${m.name}</div>
        <div class="tm-role">${m.role}</div>
        <div class="text-muted" style="font-size:11px;margin-top:2px">↳ ${m.activity}</div>
      </div>
      <div class="team-status" style="color:${statusColors[m.status]}">${statusLabels[m.status]}</div>
    </div>`).join('');
}

// ---- Utilitários ----
function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---- Init ----
initPostAvatars();
renderFeed();
renderMural();
renderTeam();
</script>
</body>
</html>
